services:
  - type: worker
    name: commission-feedback-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: TICKET_CATEGORY_ID
        sync: false
      - key: FEEDBACK_CHANNEL_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: STAFF_ROLE_ID
        sync: false
      - key: COMMISSION_ROLE_ID
        sync: false
